# Verifica en cada cambio que el juego siga compilando: la versión de compu y la web.
name: Compilar

on:
  push:
  pull_request:

jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Verificar sprites y regeneracion
        run: python -m unittest discover -s mods/CristinaOfPersia/tools -p 'test_*.py' -v

  compu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev
      - name: Compilar
        run: make -C src -j4

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Compilar para el navegador
        run: sh webbuild/build.sh
      - name: Revisar el resultado
        run: |
          for f in index.html sw.js prince.js prince.wasm prince.data manifest.json; do
            test -s "web/$f" || { echo "falta web/$f"; exit 1; }
          done
          ! grep -q __VERSION__ web/index.html web/sw.js
